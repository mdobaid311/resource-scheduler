name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: resource-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: resource-scheduler/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate the shadcn registry with the real CLI
        # registry.json lives at the repo root, not in the package folder.
        working-directory: .
        run: npx --yes shadcn@latest build registry.json -o "$RUNNER_TEMP/registry"
      - name: Size budget and published files
        run: npm run check:size
      - name: Bundle sanity
        run: |
          head -c 12 dist/index.esm.js | grep -q '"use client"'
          ! grep -q "react.transitional.element" dist/index.esm.js
          ! grep -Eq "(^|[},])body\{|html,:host|--background:" dist/resource-scheduler.css

  docs:
    # The docs site embeds the real component, so it also checks that the
    # package source compiles inside another project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            resource-scheduler/package-lock.json
            docs/package-lock.json
      - name: Install the package (the demos import its source)
        run: npm ci
        working-directory: resource-scheduler
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
