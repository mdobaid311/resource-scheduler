name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: resource-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: resource-scheduler/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate the shadcn registry with the real CLI
        # registry.json lives at the repo root, not in the package folder.
        working-directory: .
        run: npx --yes shadcn@latest build registry.json -o "$RUNNER_TEMP/registry"
      - name: Size budget and published files
        run: npm run check:size
      - name: Both entry points load (ESM and CJS)
        run: npm run check:entries
      - name: Bundle sanity
        run: |
          head -c 12 dist/index.esm.js | grep -q '"use client"'
          ! grep -q "react.transitional.element" dist/index.esm.js
          ! grep -Eq "(^|[},])body\{|html,:host|--background:" dist/resource-scheduler.css

  changeset:
    # Every PR carries a changeset (`npm run changeset`), or an empty one
    # (`npm run changeset -- --empty`) when nothing user-visible changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resource-scheduler
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resource-scheduler/package-lock.json
      - run: npm ci
      - run: npx changeset status --since=origin/${{ github.base_ref }}

  docs:
    # The docs site embeds the real component, so it also checks that the
    # package source compiles inside another project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            resource-scheduler/package-lock.json
            docs/package-lock.json
      - name: Install the package (the demos import its source)
        run: npm ci
        working-directory: resource-scheduler
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - name: Smoke test in Chrome (mouse, keyboard and touch)
        # Serves the built docs and drives the live demos with real input events.
        working-directory: docs
        run: |
          npx astro preview --port 4399 &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:4399/ && break; sleep 1; done
          npm run smoke

  starter:
    # resource-scheduler-rooms-starter uses the published package, so it also catches a release that breaks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resource-scheduler-rooms-starter/package-lock.json
      - run: npm ci
        working-directory: resource-scheduler-rooms-starter
      - run: npm run build
        working-directory: resource-scheduler-rooms-starter
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/rooms
