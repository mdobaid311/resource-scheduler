<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resource Scheduler Showcase</title>
    <meta
      name="description"
      content="A React resource timeline with drag, resize, availability and utilization. Try room booking, shift rosters, equipment rental, field service and project allocation, in any theme and density."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resource Scheduler" />
    <meta property="og:title" content="Resource Scheduler Showcase" />
    <meta
      property="og:description"
      content="Six working recipes on one page: drag, resize, book, assign. Switch theme and density live."
    />
    <meta property="og:image" content="https://resource-scheduler-docs.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resource Scheduler Showcase" />
    <meta name="twitter:image" content="https://resource-scheduler-docs.vercel.app/og.png" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var s = JSON.parse(localStorage.getItem("rs-showcase") || "{}");
        if (s.theme === "light" || s.theme === "dark" || s.theme === "system")
          document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
